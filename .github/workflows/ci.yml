name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: 256

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --release

      - name: Negative Control (Lost Update Detected)
        run: cargo test --release --features unsafe-no-conflict-check -- lost_update_detected

      - name: Crash Smoke Test
        run: cargo run --release --bin crashtest -- --runs 30 --seed $GITHUB_RUN_ID

      - name: Crash Tear Test
        run: cargo run --release --bin crashtest -- --tear --runs 20 --seed $GITHUB_RUN_ID
